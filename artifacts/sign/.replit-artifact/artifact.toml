kind = "web"
previewPath = "/sign/"
title = "Signature de documents"
version = "1.0.0"
id = "artifacts/sign"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sign/" ]
localPort = 24699

[services.development]
run = "pnpm --filter @workspace/sign run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sign", "run", "build" ]
publicDir = "artifacts/sign/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24699"
BASE_PATH = "/sign/"
